<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="并发写时序">
<title>并发写时序</title>
<rect x="0" y="0" width="1200" height="420" fill="#ffffff"/>
<defs>
<marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
  <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
</marker>
<marker id="arrowgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
  <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
</marker>
</defs>
<text x="40" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="20" fill="#1f2328" font-weight="700" text-anchor="start">两个进程同时写同一份记忆：为什么不丢更新</text>
<text x="40" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">关键只有一条：重载发生在修改之前。反过来（先改后查）两边都认为自己最新，后写的整段覆盖前一个。</text>
<text x="40" y="125" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#1a7f37" font-weight="700" text-anchor="start">进程 A</text>
<line x1="120" y1="120" x2="1160" y2="120" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 5"/>
<text x="40" y="265" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#0969da" font-weight="700" text-anchor="start">进程 B</text>
<line x1="120" y1="260" x2="1160" y2="260" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 5"/>
<rect x="160" y="105.0" width="150" height="30" rx="8" fill="#e9f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="235.0" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1a7f37" font-weight="600" text-anchor="middle">BEGIN IMMEDIATE</text>
<rect x="330" y="105.0" width="210" height="30" rx="8" fill="#e9f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="435.0" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1a7f37" font-weight="600" text-anchor="middle">重载：磁盘仍是 rev3</text>
<rect x="560" y="105.0" width="150" height="30" rx="8" fill="#e9f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="635.0" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1a7f37" font-weight="600" text-anchor="middle">写 a2 → rev4</text>
<rect x="730" y="105.0" width="90" height="30" rx="8" fill="#e9f5ec" stroke="#1a7f37" stroke-width="1.2"/>
<text x="775.0" y="124" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1a7f37" font-weight="600" text-anchor="middle">COMMIT</text>
<rect x="160" y="245.0" width="260" height="30" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="290.0" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#57606a" font-weight="600" text-anchor="middle">BEGIN（等锁 120ms）</text>
<rect x="440" y="245.0" width="300" height="30" rx="8" fill="#e8f1fd" stroke="#0969da" stroke-width="1.2"/>
<text x="590.0" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0969da" font-weight="600" text-anchor="middle">拿到锁 → 重载（看到 rev4）</text>
<rect x="760" y="245.0" width="170" height="30" rx="8" fill="#e8f1fd" stroke="#0969da" stroke-width="1.2"/>
<text x="845.0" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0969da" font-weight="600" text-anchor="middle">写 b2 → rev5</text>
<rect x="940" y="245.0" width="90" height="30" rx="8" fill="#e8f1fd" stroke="#0969da" stroke-width="1.2"/>
<text x="985.0" y="264" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#0969da" font-weight="600" text-anchor="middle">COMMIT</text>
<line x1="560" y1="145" x2="560" y2="232" stroke="#57606a" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arrowhead)"/>
<text x="568" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11" fill="#57606a" font-weight="400" text-anchor="start">A 持锁</text>
<rect x="40" y="306" width="1120" height="96" rx="12" fill="#e9f5ec" stroke="#8cc7a0" stroke-width="1.2"/>
<text x="60" y="332" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14.5" fill="#1a7f37" font-weight="700" text-anchor="start">结果：两条都在。</text>
<text x="60" y="356" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.8" fill="#1f2328" font-weight="400" text-anchor="start">B 没有把 A 的 rev4 冲掉 —— 因为它在改之前先读了 rev4；它只写自己脏掉的那一行。</text>
<text x="60" y="380" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" fill="#57606a" font-weight="400" text-anchor="start">验证：tests/test_store.py —— 4 进程 × 15 条 + 15 次 merge 同一条，access_count 恰好 60，fsck 通过。</text>
</svg>

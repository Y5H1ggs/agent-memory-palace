<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 392" width="1200" height="392" role="img" aria-label="一轮代谢的次序">
<title>一轮代谢的次序</title>
<rect x="0" y="0" width="1200" height="392" fill="#ffffff"/>
<defs>
<marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
  <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
</marker>
<marker id="arrowgreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
  <path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/>
</marker>
</defs>
<text x="40" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="20" fill="#1f2328" font-weight="700" text-anchor="start">一轮代谢：次序本身是设计</text>
<text x="40" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#57606a" font-weight="400" text-anchor="start">沉淀必须早于遗忘（刚要结晶的碎片不能被先扫走）；自述必须晚于遗忘（不能讲到已经不在的东西）</text>
<rect x="40" y="100" width="250" height="96" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.4"/>
<text x="58" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15.5" fill="#1a7f37" font-weight="700" text-anchor="start">1. 写入</text>
<text x="58" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" fill="#57606a" font-weight="400" text-anchor="start">情绪从文本/结果推断</text>
<text x="58" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" fill="#57606a" font-weight="400" text-anchor="start">语用判断：禁令 / 请求 / 撤回</text>
<line x1="294" y1="148.0" x2="308" y2="148.0" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#arrowhead)"/>
<rect x="314" y="100" width="250" height="96" rx="12" fill="#ffffff" stroke="#9a6700" stroke-width="1.4"/>
<text x="332" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15.5" fill="#9a6700" font-weight="700" text-anchor="start">2. 沉淀</text>
<text x="332" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" fill="#57606a" font-weight="400" text-anchor="start">标签同源 或 内容同义</text>
<text x="332" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" fill="#57606a" font-weight="400" text-anchor="start">单向门：碎片降级为溯源</text>
<line x1="568" y1="148.0" x2="582" y2="148.0" stroke="#9a6700" stroke-width="1.6" marker-end="url(#arrowhead)"/>
<rect x="588" y="100" width="250" height="96" rx="12" fill="#ffffff" stroke="#0969da" stroke-width="1.4"/>
<text x="606" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15.5" fill="#0969da" font-weight="700" text-anchor="start">3. 抓取</text>
<text x="606" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" fill="#57606a" font-weight="400" text-anchor="start">预算内留下最该留的</text>
<text x="606" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" fill="#57606a" font-weight="400" text-anchor="start">被抓住的不会被遗忘</text>
<line x1="842" y1="148.0" x2="856" y2="148.0" stroke="#0969da" stroke-width="1.6" marker-end="url(#arrowhead)"/>
<rect x="862" y="100" width="250" height="96" rx="12" fill="#ffffff" stroke="#cf222e" stroke-width="1.4"/>
<text x="880" y="130" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15.5" fill="#cf222e" font-weight="700" text-anchor="start">4. 遗忘</text>
<text x="880" y="156" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" fill="#57606a" font-weight="400" text-anchor="start">结论按价值、碎片按强度</text>
<text x="880" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" fill="#57606a" font-weight="400" text-anchor="start">钉死的一律不删</text>
<rect x="862" y="242" width="250" height="96" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.4"/>
<text x="880" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15.5" fill="#8250df" font-weight="700" text-anchor="start">5. 自述</text>
<text x="880" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" fill="#57606a" font-weight="400" text-anchor="start">投影而非节点</text>
<text x="880" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" fill="#57606a" font-weight="400" text-anchor="start">叙事地位会随时间退潮</text>
<line x1="844" y1="290.0" x2="858" y2="290.0" stroke="#8250df" stroke-width="1.6"/>
<path d="M844,285.0 L839,290.0 L844,295.0 z" fill="#8250df"/>
<rect x="588" y="242" width="250" height="96" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.4"/>
<text x="606" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15.5" fill="#8250df" font-weight="700" text-anchor="start">6. 人格</text>
<text x="606" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" fill="#57606a" font-weight="400" text-anchor="start">基座只读 / 人格生长</text>
<text x="606" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" fill="#57606a" font-weight="400" text-anchor="start">人设可换，变更留痕</text>
<line x1="570" y1="290.0" x2="584" y2="290.0" stroke="#8250df" stroke-width="1.6"/>
<path d="M570,285.0 L565,290.0 L570,295.0 z" fill="#8250df"/>
<rect x="314" y="242" width="250" height="96" rx="12" fill="#ffffff" stroke="#9a6700" stroke-width="1.4"/>
<text x="332" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15.5" fill="#9a6700" font-weight="700" text-anchor="start">7. 反思</text>
<text x="332" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" fill="#57606a" font-weight="400" text-anchor="start">指标化回看 + 可选 LLM</text>
<text x="332" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" fill="#57606a" font-weight="400" text-anchor="start">只提建议，不改配置</text>
<line x1="296" y1="290.0" x2="310" y2="290.0" stroke="#9a6700" stroke-width="1.6"/>
<path d="M296,285.0 L291,290.0 L296,295.0 z" fill="#9a6700"/>
<rect x="40" y="242" width="250" height="96" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.4"/>
<text x="58" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="15.5" fill="#1a7f37" font-weight="700" text-anchor="start">8. 自修正</text>
<text x="58" y="298" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" fill="#57606a" font-weight="400" text-anchor="start">白名单 + 值域 + 护栏</text>
<text x="58" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" fill="#57606a" font-weight="400" text-anchor="start">可回滚，反复改错就交还给人</text>
<line x1="987.0" y1="200" x2="987.0" y2="238" stroke="#57606a" stroke-width="1.6" marker-end="url(#arrowhead)"/>
<line x1="165.0" y1="238" x2="165.0" y2="200" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#arrowhead)"/>
<text x="179.0" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#1a7f37" font-weight="400" text-anchor="start">下一轮从这里继续</text>
</svg>

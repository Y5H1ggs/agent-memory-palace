<text x="40" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="20" fill="#1f2328" font-weight="700" text-anchor="start">106 个领域：召回分布与最差的几个</text>

<text x="742" y="204" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2328" font-weight="700" text-anchor="end">0.757</text>
<text x="518" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">去重 F1</text>
<text x="742" y="230" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12" fill="#1f2328" font-weight="700" text-anchor="end">0.944</text>
<rect x="790" y="100" width="370" height="168" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>

<rect x="40" y="448" width="1120" height="96" rx="12" fill="#e8f1fd" stroke="#9ec5f7" stroke-width="1.2"/>
<text x="60" y="474" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">读法：稠密通道的收益全部来自「换说法」（0.591 → 0.727），exact 上没有增益。</text>
<text x="60" y="498" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="start">这恰好说明它替代不了真模型：内置哈希只补字面变形。接真模型后，用同一条命令重测就知道值不值。</text>
<text x="60" y="526" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.5" fill="#57606a" font-weight="400" text-anchor="start">弃答 F1 0.86 / 1.00（阈值 0.20，由 calibrate 扫出来，不是拍出来的）。</text>

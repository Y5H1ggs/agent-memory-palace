<text x="140" y="173" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="end">0.5–0.7</text>
<rect x="150" y="158" width="300" height="22" rx="5" fill="#eef1f4" stroke="none" stroke-width="1.2"/>

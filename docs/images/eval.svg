<text x="808" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">zh-infant</text>
<text x="1140" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.8" fill="#9a6700" font-weight="700" text-anchor="end">0.50</text>
<text x="808" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.5" fill="#57606a" font-weight="400" text-anchor="start">zh-aquarium</text>
<text x="1140" y="248" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.8" fill="#9a6700" font-weight="700" text-anchor="end">0.50</text>
<rect x="40" y="300" width="1120" height="96" rx="12" fill="#e8f1fd" stroke="#9ec5f7" stroke-width="1.2"/>
<text x="60" y="326" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="13" fill="#1f2328" font-weight="700" text-anchor="start">为什么最差的是它们：词法通道只会「找一样的词」。</text>
<text x="60" y="350" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" fill="#57606a" font-weight="400" text-anchor="start">「猫不爱喝水」问的是「饮水/缺水」，一个字都不一样；这种题只有真神经模型能救，所以 eval 会把它们点名，而不是藏在平均值里。</text>
<text x="60" y="374" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.3" fill="#57606a" font-weight="400" text-anchor="start">报告里同样的道理：默认只印汇总 + 最差 5 个，加 --verbose 才逐个看。</text>
</svg>

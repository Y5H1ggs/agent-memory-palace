[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-palace"
version = "0.14.0"
description = "Long-term memory for LLM agents and AI assistants: forgetting curve, abstention, SQLite/WAL backend, multi-process writes, MCP server, zero third-party dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Howard", email = "110075474+Y5H1ggs@users.noreply.github.com" }]
keywords = [
    "ai-memory",
    "agent-memory",
    "llm-memory",
    "long-term-memory",
    "cross-session-memory",
    "memory-mcp-server",
    "mcp",
    "forgetting-curve",
    "abstention",
    "rag-alternative",
    "vector-database-alternative",
    "sqlite",
    "sqlite-wal",
    "cognitive-architecture",
    "zero-dependencies",
    "python",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
memory-palace = "memory_palace.cli:main"
memory-palace-mcp = "memory_palace.mcp_server:main"
memory-palace-http = "memory_palace.http_api:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Y5H1ggs/agent-memory-palace"
Source = "https://github.com/Y5H1ggs/agent-memory-palace"
Changelog = "https://github.com/Y5H1ggs/agent-memory-palace/blob/main/CHANGELOG.md"
Issues = "https://github.com/Y5H1ggs/agent-memory-palace/issues"

[tool.setuptools.packages.find]
include = ["memory_palace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

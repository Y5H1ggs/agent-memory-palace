[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-palace"
version = "0.10.0"
description = "A dependency-free memory lifecycle with a SQLite/WAL backend, row-level writes, multi-process safety, pluggable embeddings, component benchmarks and bounded self-correction."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Howard", email = "110075474+Y5H1ggs@users.noreply.github.com" }]
keywords = [
    "memory",
    "agent-memory",
    "cognitive-architecture",
    "forgetting-curve",
    "self-narrative",
    "python",
    "sqlite",
    "durable",
    "zero-dependencies",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
memory-palace = "memory_palace.cli:main"
memory-palace-mcp = "memory_palace.mcp_server:main"
memory-palace-http = "memory_palace.http_api:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Y5H1ggs/memory-palace"
Source = "https://github.com/Y5H1ggs/memory-palace"
Changelog = "https://github.com/Y5H1ggs/memory-palace/blob/main/CHANGELOG.md"
Issues = "https://github.com/Y5H1ggs/memory-palace/issues"

[tool.setuptools.packages.find]
include = ["memory_palace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

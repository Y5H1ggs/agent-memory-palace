name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selfcheck:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      # windows-latest 默认 cp1252，中文输出会炸；代码里也有兜底，这里是双保险
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装（无第三方依赖）
        run: python -m pip install -e .
      - name: 示例可运行
        run: python examples/quickstart.py
      - name: 完整自测（215 项断言 + 18 条突变审计）
        run: python -m memory_palace.demo

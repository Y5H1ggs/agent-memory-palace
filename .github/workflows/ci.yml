name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selfcheck:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    env:
      # windows-latest 默认 cp1252，中文输出会炸；代码里也有兜底，这里是双保险
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装（无第三方依赖）
        run: python -m pip install -e .
      - name: 示例可运行
        run: python examples/quickstart.py
      - name: 完整自测（全剧本断言）
        run: python -m memory_palace.demo
      - name: CLI 契约自测
        run: python tests/test_cli.py
      - name: MCP / HTTP 接入层自测
        run: python tests/test_integrations.py
      - name: 双时态 / 去重 / 弃答自测
        run: python tests/test_temporal.py
      - name: 跨项目作用域自测
        run: python tests/test_scope.py
      - name: 扩展点自测（编码器 / 外部反思）
        run: python tests/test_extensions.py
      - name: 词法层自测（含 IDF 反事实）
        run: python tests/test_lexicon.py
      - name: 语用层自测（撤回≠同意 / 模糊降级）
        run: python tests/test_pragmatics.py
      - name: 代码审计（优化保序 / 边界校验 / 增量补建）
        run: python tests/test_audit.py
      - name: 持久化契约（多进程并发 / 增量写 / 崩溃前滚 / 导出导入）
        run: python tests/test_store.py
      - name: 跨进程锁（真子进程争用 / 重入 / 超时）
        run: python tests/test_locking.py
      - name: 组件级评测（检索 / 弃答 / 去重 / 沉淀，含标定）
        run: python tests/test_eval.py
      - name: 嵌入通道（确定性 / HTTP 缓存 / 混合增益）
        run: python tests/test_embedding.py
      - name: LLM 反思边界（结构 / 降级 / 白名单 / 不改配置）
        run: python tests/test_llm.py
      - name: 多目标护栏（主指标改善但护栏崩 → 回滚）
        run: python tests/test_guardrails.py
      - name: 文档一致性（版本号 / 默认存储 / 历史文档时效声明）
        run: python tests/test_docs.py
      - name: 评审包是否最新（llms-full.txt 由代码与文档生成）
        run: python tools/make_review_bundle.py --check
      - name: 绿灯体检（变异测试，必须 0 漏洞）
        run: python tools/greenlight_audit.py
      - name: 编码器示例可跑
        run: python examples/custom_encoder.py
      - name: 基准冒烟（200 条）
        run: python -m memory_palace.bench 200
      - name: 评测命令冒烟
        run: python -m memory_palace.cli eval
      - name: 演示库可生成
        run: python examples/showcase.py --days 60
